info:
  name: Get Episodes current Week
  type: http
  seq: 6

http:
  method: GET
  url: "{{base_url}}/api/v1/episodes/current-week"
  params:
    - name: platform
      value: joyn
      type: query
      disabled: true
    - name: timezone
      value: Europe/London
      type: query
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

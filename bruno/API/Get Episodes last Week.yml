info:
  name: Get Episodes last Week
  type: http
  seq: 8

http:
  method: GET
  url: "{{base_url}}/api/v1/episodes/last-week?timezone=Europe/London"
  params:
    - name: platform
      value: joyn
      type: query
      disabled: true
    - name: timezone
      value: Europe/London
      type: query
      description: "Default: Europe/Vienna"
    - name: includePreviews
      value: "false"
      type: query
      description: "Default: true"
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

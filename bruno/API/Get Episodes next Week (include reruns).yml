info:
  name: Get Episodes next Week (include reruns)
  type: http
  seq: 9

http:
  method: GET
  url: "{{base_url}}/api/v1/episodes/next-week?timezone=Europe/London&includeReruns=true"
  params:
    - name: platform
      value: rtlplus
      type: query
      disabled: true
    - name: timezone
      value: Europe/London
      type: query
      description: "Default: Europe/Vienna"
    - name: includeReruns
      value: "true"
      type: query
      description: "Default: false"
    - name: includePreviews
      value: "false"
      type: query
      description: "Default: true"
      disabled: true
    - name: includeReleaseHistory
      value: "true"
      type: query
      description: "Default: false"
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

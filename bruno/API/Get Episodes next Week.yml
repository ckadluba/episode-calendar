info:
  name: Get Episodes next Week
  type: http
  seq: 7

http:
  method: GET
  url: "{{base_url}}/api/v1/episodes/next-week"
  params:
    - name: platform
      value: rtlplus
      type: query
      disabled: true
    - name: timezone
      value: Europe/London
      type: query
      description: "Default: Europe/Vienna"
      disabled: true
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

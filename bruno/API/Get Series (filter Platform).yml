info:
  name: Get Series (filter Platform)
  type: http
  seq: 3

http:
  method: GET
  url: "{{base_url}}/api/v1/series?platform=rtlplus"
  params:
    - name: platform
      value: rtlplus
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

info:
  name: RTL+ EPG
  type: http
  seq: 1

http:
  method: GET
  url: https://pc.middleware.rtlde.bedrock.tech/6play/v2/platforms/m6group_web/services/rtlde_rtl/guidetv?channel=rtlde_rtl,rtlde_vox,rtlde_rtlzwei,rtlde_voxup&from=2026-11-02 00:00:00&to=2026-11-15 23:59:59&limit=100&offset=0&with=realdiffusiondates
  headers:
    - name: Accept
      value: application/json
  params:
    - name: channel
      value: rtlde_rtl,rtlde_vox,rtlde_rtlzwei,rtlde_voxup
      type: query
      description: RTL+ channel codes (comma separated, no spaces)
    - name: from
      value: 2026-11-02 00:00:00
      type: query
      description: "Format: YYYY-MM-DD HH:MM:SS (quote it, otherwise YAML turns it into a timestamp)"
    - name: to
      value: 2026-11-15 23:59:59
      type: query
      description: "Format: YYYY-MM-DD HH:MM:SS"
    - name: limit
      value: "100"
      type: query
      description: Events per channel; 100 is the maximum the API accepts (101 returns 400)
    - name: offset
      value: "0"
      type: query
      description: Page offset per channel; the response holds at most 100 events per channel, so widen the window in steps of 100 (0, 100, 200, ...)
    - name: with
      value: realdiffusiondates
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  RTL+ EPG (guidetv) for the channels RTL, VOX, RTL ZWEI and VOXup.

  The query string is maintained twice on purpose:

  - `url` is what actually gets sent. Bruno does not append a `params:` block
    to the request URL, so a request with only `params:` goes out without any
    query and the API answers `Parameter "channel" of value "NULL" ...`.
  - `params` feeds the Params table in the UI. Editing a row rewrites the URL
    from that table (raw, unencoded values), so the table stays authoritative
    for whatever you change there.

  Keep both in sync. Adding a parameter only to `params` (without touching the
  URL) has no effect on the wire until you edit a value in the table.

  Values stay raw here (literal commas, spaces and colons) because
  `encodeUrl: true` encodes the query exactly once. Writing `%2C` would arrive
  as `%252C` at the server.

  The window is limited: the API returns at most 100 events per channel
  (`limit`, max 100 - 101 is a 400), so a response only covers a few days per
  channel. Page with `offset` (0, 100, 200, ...) or narrow `from`/`to`.
  Timestamps must be quoted, otherwise YAML turns them into a date and Bruno
  sends `Tue Oct 06 2026 00:00:00 GMT+0200 (...)`.

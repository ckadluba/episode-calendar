info:
  name: EpisodeCalendarSeries
  type: graphql
  seq: 1

graphql:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Content-Type
      value: application/json
    - name: Joyn-Platform
      value: web
    - name: Joyn-Client-Version
      value: 5.1579.1
    - name: Joyn-Distribution-Tenant
      value: JOYN_AT
    - name: Joyn-Country
      value: AT
    - name: x-api-key
      value: "{{joyn_api_key}}"
  body:
    query: |-
      query EpisodeCalendarSeries($path: String!) {
          page(path: $path) {
            __typename
            ... on SeriesPage {
              series {
                id
                title
                description
                seasons {
                  id
                  number
                  numberOfEpisodes
                  episodes(first: 20, offset: 0) {
                    id
                    number
                    airdate
                    endsAt
                    title
                    path
                  }
                }
              }
            }
          }
        }
    variables: |2-
        {
          "path": "/serien/villa-der-versuchung"
      //    "path": "/serien/forsthaus-rampensau"
        }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

info:
  name: AlgoliaApiKey
  type: graphql
  seq: 2

graphql:
  method: POST
  url: "{{base_url}}/graphql"
  headers:
    - name: Content-Type
      value: application/json
    - name: Joyn-Platform
      value: web
    - name: Joyn-Client-Version
      value: 5.1579.1
    - name: Joyn-Distribution-Tenant
      value: JOYN_AT
    - name: Joyn-Country
      value: AT
    - name: x-api-key
      value: "{{joyn_api_key}}"
  body:
    query: |2-
        query AlgoliaApiKey {
          searchApiKey
        }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
